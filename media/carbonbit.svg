<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 16 16" fill="#c5c5c5" shape-rendering="crispEdges">
  <!-- pixel leaf with a diagonal vein -->
  <rect x="9" y="1" width="5" height="1"/>
  <rect x="7" y="2" width="5" height="1"/><rect x="13" y="2" width="2" height="1"/>
  <rect x="6" y="3" width="5" height="1"/><rect x="12" y="3" width="3" height="1"/>
  <rect x="5" y="4" width="5" height="1"/><rect x="11" y="4" width="4" height="1"/>
  <rect x="5" y="5" width="4" height="1"/><rect x="10" y="5" width="4" height="1"/>
  <rect x="4" y="6" width="4" height="1"/><rect x="9" y="6" width="4" height="1"/>
  <rect x="4" y="7" width="3" height="1"/><rect x="8" y="7" width="4" height="1"/>
  <rect x="4" y="8" width="2" height="1"/><rect x="7" y="8" width="4" height="1"/>
  <rect x="5" y="9" width="4" height="1"/>
  <!-- stem -->
  <rect x="3" y="10" width="1" height="1"/>
  <rect x="2" y="11" width="1" height="1"/>
  <rect x="1" y="12" width="1" height="1"/>
  <!-- terminal prompt ">_" -->
  <rect x="7" y="11" width="1" height="1"/>
  <rect x="8" y="12" width="1" height="1"/>
  <rect x="7" y="13" width="1" height="1"/>
  <rect x="10" y="13" width="4" height="1"/>
</svg>
